name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    strategy:
      matrix:
        runner: [node-34-custom, node-41-custom]
      fail-fast: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build info
        id: info
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Setup verify deps
        run: |
          apt-get install -y zsh shellcheck 2>/dev/null || true

      - name: Verify syntax
        run: make verify

      - name: Install shell config
        env:
          HOME: /home/thiraphat
        run: |
          chmod +x install.sh
          ./install.sh --force
          chown -R 1000:1000 /home/thiraphat/.zshrc \
            /home/thiraphat/.p10k.zsh \
            /home/thiraphat/.config/zsh \
            /home/thiraphat/.zshenv 2>/dev/null || true

      - name: Notify
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          STATUS="${{ job.status }}"
          ICON=$([ "$STATUS" = "success" ] && echo "✅" || echo "❌")
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d parse_mode="Markdown" \
            -d text="${ICON} *customizecmd* - ${{ matrix.runner }} - ${STATUS} - ${{ steps.info.outputs.sha }}"
