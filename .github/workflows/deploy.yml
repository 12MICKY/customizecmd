name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, "${{ matrix.runner }}"]
    timeout-minutes: 10
    strategy:
      matrix:
        runner: [node-34-custom, node-41-custom]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set build info
        id: info
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Install shell config
        run: |
          chmod +x install.sh
          ./install.sh

      - name: Verify
        run: make verify

      - name: Notify
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          STATUS="${{ job.status }}"
          ICON=$([ "$STATUS" = "success" ] && echo "✅" || echo "❌")
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d parse_mode="Markdown" \
            -d text="${ICON} *customizecmd* on ${{ matrix.runner }}
Status: ${STATUS}
Commit: \`${{ steps.info.outputs.sha }}\`
By: ${{ github.actor }}"
